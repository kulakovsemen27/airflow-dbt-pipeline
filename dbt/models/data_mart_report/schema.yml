version: 2

models:
  - name: metrics_overview
    description: Daily financial and betting metrics by country and registration type.
    columns:
      - name: country
        description: Country where the players registered.
        tests:
          - not_null
      - name: registration_type
        description: Type of player registration.
        tests:
          - not_null
      - name: activity_date
        description: Date for which the metrics were aggregated.
        tests:
          - not_null
      - name: deposits_amount_usd
        description: Total deposit amount in US dollars for the segment and date.
        tests:
          - not_null
      - name: withdrawals_amount_usd
        description: Total withdrawal amount in US dollars for the segment and date.
        tests:
          - not_null
      - name: bets_amount_usd
        description: Total bet amount in US dollars for the segment and date.
        tests:
          - not_null
      - name: loaded_at
        description: Latest upstream load timestamp included in the report row.
        tests:
          - not_null

  - name: monthly_summary
    description: Monthly financial and betting metrics by country.
    columns:
      - name: activity_month
        description: First day of the month for which the metrics were aggregated.
        tests:
          - not_null
      - name: country
        description: Country where the players registered.
        tests:
          - not_null
      - name: deposits_amount_usd
        description: Total deposit amount in US dollars for the country and month.
        tests:
          - not_null
      - name: withdrawals_amount_usd
        description: Total withdrawal amount in US dollars for the country and month.
        tests:
          - not_null
      - name: bets_amount_usd
        description: Total bet amount in US dollars for the country and month.
        tests:
          - not_null
      - name: loaded_at
        description: Latest source load timestamp included in the summary.
        tests:
          - not_null
