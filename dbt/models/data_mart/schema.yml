version: 2

models:
  - name: dim_player
    description: One row per player.
    columns:
      - name: player_id
        description: Unique identifier of the player.
        tests:
          - not_null
          - unique
      - name: registration_date
        description: Date when the player registered.
        tests:
          - not_null
      - name: registration_type
        description: Type of player registration.
        tests:
          - not_null
      - name: country
        description: Country where the player registered.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when the dimension was built.
        tests:
          - not_null

  - name: dim_provider
    description: One row per provider.
    columns:
      - name: provider_id
        description: Unique identifier of the provider.
        tests:
          - not_null
          - unique
      - name: provider_name
        description: Name of the provider.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when the dimension was built.
        tests:
          - not_null

  - name: dim_game
    description: One row per game.
    columns:
      - name: game_id
        description: Unique identifier of the game.
        tests:
          - not_null
          - unique
      - name: game_name
        description: Name of the game.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when the dimension was built.
        tests:
          - not_null

  - name: fact_deposit
    description: One row per deposit.
    columns:
      - name: deposit_id
        description: Unique identifier of the deposit.
        tests:
          - not_null
          - unique
      - name: player_id
        description: Identifier of the player who made the deposit.
        tests:
          - not_null
      - name: provider_id
        description: Identifier of the provider that processed the deposit.
        tests:
          - not_null
      - name: deposit_date
        description: Date of the deposit.
        tests:
          - not_null
      - name: currency
        description: Currency code of the original deposit amount.
        tests:
          - not_null
      - name: amount
        description: Deposit amount in the original currency.
        tests:
          - not_null
      - name: amount_usd
        description: Deposit amount converted to US dollars.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when the fact was built.
        tests:
          - not_null

  - name: fact_withdrawal
    description: One row per withdrawal.
    columns:
      - name: withdrawal_id
        description: Unique identifier of the withdrawal.
        tests:
          - not_null
          - unique
      - name: player_id
        description: Identifier of the player who made the withdrawal.
        tests:
          - not_null
      - name: provider_id
        description: Identifier of the provider that processed the withdrawal.
        tests:
          - not_null
      - name: withdrawal_date
        description: Date of the withdrawal.
        tests:
          - not_null
      - name: currency
        description: Currency code of the original withdrawal amount.
        tests:
          - not_null
      - name: amount
        description: Withdrawal amount in the original currency.
        tests:
          - not_null
      - name: amount_usd
        description: Withdrawal amount converted to US dollars.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when the fact was built.
        tests:
          - not_null

  - name: fact_bet
    description: One row per bet.
    columns:
      - name: bet_id
        description: Unique identifier of the bet.
        tests:
          - not_null
          - unique
      - name: player_id
        description: Identifier of the player who placed the bet.
        tests:
          - not_null
      - name: game_id
        description: Identifier of the game in which the bet was placed.
        tests:
          - not_null
      - name: provider_id
        description: Identifier of the provider recorded in the bet.
        tests:
          - not_null
      - name: bet_date
        description: Date when the bet was placed.
        tests:
          - not_null
      - name: currency
        description: Currency code of the original bet amount.
        tests:
          - not_null
      - name: amount
        description: Bet amount in the original currency.
        tests:
          - not_null
      - name: amount_usd
        description: Bet amount converted to US dollars.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when the fact was built.
        tests:
          - not_null

  - name: player_metrics
    description: Daily financial and betting metrics per player.
    columns:
      - name: player_id
        description: Identifier of the player.
        tests:
          - not_null
      - name: activity_date
        description: Date for which the player metrics were aggregated.
        tests:
          - not_null
      - name: deposits_amount_usd
        description: Total deposit amount in US dollars for the player and date.
        tests:
          - not_null
      - name: withdrawals_amount_usd
        description: Total withdrawal amount in US dollars for the player and date.
        tests:
          - not_null
      - name: bets_amount_usd
        description: Total bet amount in US dollars for the player and date.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when the aggregate model was built.
        tests:
          - not_null
