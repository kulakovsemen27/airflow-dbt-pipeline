version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: players
      - name: providers_map
      - name: games_map
      - name: currency_rates
      - name: deposits
      - name: withdrawals
      - name: games

models:
  - name: players
    columns:
      - name: player_id
        description: Unique identifier of the player.
        tests:
          - not_null
          - unique
      - name: registration_date
        description: Date when the player registered.
        tests:
          - not_null
      - name: registration_type
        description: Type of player registration.
        tests:
          - not_null
      - name: country
        description: Country where the player registered.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when this source version was detected in raw.
        tests:
          - not_null

  - name: providers_map
    columns:
      - name: provider_id
        description: Unique identifier of the provider.
        tests:
          - not_null
          - unique
      - name: provider_name
        description: Name of the provider.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when this source version was detected in raw.
        tests:
          - not_null

  - name: games_map
    columns:
      - name: game_id
        description: Unique identifier of the game.
        tests:
          - not_null
          - unique
      - name: game_name
        description: Name of the game.
        tests:
          - not_null
      - name: provider_id
        description: Identifier of the provider associated with the game.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when this source version was detected in raw.
        tests:
          - not_null

  - name: currency_rates
    columns:
      - name: rate_date
        description: Date for which the exchange rate is provided.
        tests:
          - not_null
      - name: currency
        description: Currency code.
        tests:
          - not_null
      - name: currency_units_per_usd
        description: Number of currency units per one US dollar.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when this source version was detected in raw.
        tests:
          - not_null

  - name: deposits
    columns:
      - name: deposit_id
        description: Unique identifier of the deposit.
        tests:
          - not_null
          - unique
      - name: player_id
        description: Identifier of the player who made the deposit.
        tests:
          - not_null
      - name: deposit_date
        description: Date of the deposit.
        tests:
          - not_null
      - name: provider_id
        description: Identifier of the payment provider.
        tests:
          - not_null
      - name: amount
        description: Deposit amount in the original currency.
        tests:
          - not_null
      - name: currency
        description: Currency code of the deposit amount.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when this source version was detected in raw.
        tests:
          - not_null

  - name: withdrawals
    columns:
      - name: withdrawal_id
        description: Unique identifier of the withdrawal.
        tests:
          - not_null
          - unique
      - name: player_id
        description: Identifier of the player who made the withdrawal.
        tests:
          - not_null
      - name: withdrawal_date
        description: Date of the withdrawal.
        tests:
          - not_null
      - name: provider_id
        description: Identifier of the withdrawal provider.
        tests:
          - not_null
      - name: amount
        description: Withdrawal amount in the original currency.
        tests:
          - not_null
      - name: currency
        description: Currency code of the withdrawal amount.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when this source version was detected in raw.
        tests:
          - not_null

  - name: games
    columns:
      - name: bet_id
        description: Unique identifier of the bet.
        tests:
          - not_null
          - unique
      - name: player_id
        description: Identifier of the player who placed the bet.
        tests:
          - not_null
      - name: game_date
        description: Date when the game was played.
        tests:
          - not_null
      - name: amount
        description: Bet amount in the original currency.
        tests:
          - not_null
      - name: currency
        description: Currency code of the bet amount.
        tests:
          - not_null
      - name: provider_id
        description: Identifier of the game provider recorded in the transaction.
        tests:
          - not_null
      - name: game_id
        description: Identifier of the game from the game mapping.
        tests:
          - not_null
      - name: loaded_at
        description: Timestamp when this source version was detected in raw.
        tests:
          - not_null
